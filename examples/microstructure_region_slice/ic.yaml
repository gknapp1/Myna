steps:
- additivefoam:
    class: solidification_region_reduced
    application: additivefoam
    configure: {coarse: 80e-6, rx: 0.0005, ry: 0.0005, rz: 0.0003, pad-xy: 0.0005,
      pad-z: 0.0001, pad-sub: 0.0025, refine-layer: 1, refine-region: 1}
    execute: {batch: true, cores: 2}
- exaca:
    class: microstructure_region_slice
    application: exaca
    executable: ExaCA
    configure: {cell-size: 2.5, sub-size: 12.3, nd: 250, mu: 21, std: 3}
    execute: {batch: true, np: 8}
